<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>A Special Surprise for Oindrila! ✨</title>
    
    <!-- Google Fonts for Cursive & Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #ff4757;
            --secondary-pink: #ff6b81;
            --text-dark: #6d214f;
            --title-red: #d63031;
            --glass-bg: rgba(255, 255, 255, 0.38);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 20px 45px rgba(214, 48, 49, 0.2), 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            /* Dreamy Pink & Rose Gradient Background */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #f3a683 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh; /* Modern mobile dynamic viewport height support */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing Script', cursive;
            position: relative;
            padding: clamp(16px, 4vw, 40px);
        }

        .ambient-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            opacity: 0.75;
            animation: floatUp 10s infinite cubic-bezier(0.4, 0, 0.6, 1);
            user-select: none;
            will-change: transform, opacity;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        /* Staggered Floating Elements across viewports */
        .b1 { left: 5%;  animation-duration: 9s;  animation-delay: 0s; }
        .b2 { left: 18%; animation-duration: 12s; animation-delay: 2.5s; font-size: clamp(2rem, 5vw, 3.8rem); }
        .b3 { left: 32%; animation-duration: 10s; animation-delay: 5s; }
        .b4 { left: 48%; animation-duration: 14s; animation-delay: 1s; }
        .b5 { left: 62%; animation-duration: 11s; animation-delay: 3.5s; font-size: clamp(2.2rem, 4.5vw, 3.5rem); }
        .b6 { left: 76%; animation-duration: 9.5s; animation-delay: 0.5s; }
        .b7 { left: 89%; animation-duration: 13s; animation-delay: 4s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.85;
            }
            80% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(calc(-100vh - 120px)) rotate(25deg) scale(1.15);
                opacity: 0;
            }
        }

        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: clamp(320px, 90vw, 540px);
            display: flex;
            justify-content: center;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            border-radius: clamp(20px, 5vw, 36px);
            padding: clamp(32px, 7vw, 60px) clamp(20px, 6vw, 44px);
            text-align: center;
            width: 100%;
            box-shadow: var(--glass-shadow);
            animation: popIn 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Glass Shine Effect */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.25) 50%,
                transparent 55%
            );
            animation: shine 7s infinite linear;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translate(-30%, -30%) rotate(0deg); }
            100% { transform: translate(30%, 30%) rotate(0deg); }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.82) translateY(40px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .gift-wrapper {
            display: inline-block;
            margin-bottom: clamp(12px, 3vw, 22px);
            position: relative;
        }

        .gift-box {
            font-size: clamp(4.5rem, 15vw, 7rem);
            display: inline-block;
            cursor: pointer;
            text-decoration: none;
            animation: bounceGift 2.4s infinite ease-in-out;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
            filter: drop-shadow(0 12px 20px rgba(255, 71, 87, 0.35));
            outline: none;
            border-radius: 50%;
        }

        .gift-box:focus-visible {
            outline: 3px solid var(--primary-pink);
            outline-offset: 8px;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(calc(-1 * clamp(14px, 3vw, 24px))) scale(1.05); }
        }

        /* Hover interaction for pointer devices */
        @media (hover: hover) {
            .gift-box:hover {
                transform: scale(1.22) rotate(10deg);
                filter: drop-shadow(0 16px 28px rgba(255, 71, 87, 0.5));
            }
        }

        .gift-box:active {
            transform: scale(0.95) rotate(-5deg);
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--title-red);
            font-size: clamp(2.8rem, 8.5vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: clamp(8px, 2vw, 14px);
            text-shadow: 2px 2px 6px rgba(255, 255, 255, 0.7);
            word-wrap: break-word;
        }

        p.subtitle {
            font-family: 'Dancing Script', cursive;
            color: var(--text-dark);
            font-size: clamp(1.35rem, 4.5vw, 2.1rem);
            font-weight: 700;
            margin-bottom: clamp(28px, 6vw, 42px);
            line-height: 1.35;
        }

        .btn-wrapper {
            display: inline-block;
            width: 100%;
        }

        .open-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: clamp(240px, 80%, 320px);
            background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));
            color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1.05rem, 3.2vw, 1.35rem);
            font-weight: 700;
            padding: clamp(14px, 3.5vw, 18px) clamp(24px, 5vw, 38px);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.45);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            outline: none;
            border: none;
        }

        .open-btn:focus-visible {
            outline: 3px solid var(--text-dark);
            outline-offset: 4px;
        }

        @media (hover: hover) {
            .open-btn:hover {
                background: linear-gradient(135deg, #ff6b81, #ff4757);
                transform: translateY(-4px) scale(1.03);
                box-shadow: 0 16px 32px rgba(255, 71, 87, 0.6);
            }
        }

        .open-btn:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 6px 18px rgba(255, 71, 87, 0.4);
        }

        .btn-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        @media (hover: hover) {
            .open-btn:hover .btn-arrow {
                transform: translateX(5deg);
            }
        }

        /* Landscape mode optimization on mobile devices */
        @media (max-height: 520px) and (orientation: landscape) {
            body {
                padding: 12px;
            }
            .card {
                padding: 20px 28px;
                display: grid;
                grid-template-columns: auto 1fr;
                align-items: center;
                column-gap: 24px;
                text-align: left;
                max-width: 600px;
            }
            .gift-wrapper {
                grid-row: span 3;
                margin-bottom: 0;
            }
            h1 {
                font-size: 2.5rem;
                margin-bottom: 2px;
            }
            p.subtitle {
                font-size: 1.2rem;
                margin-bottom: 14px;
            }
            .open-btn {
                max-width: 100%;
                padding: 10px 20px;
                font-size: 1rem;
            }
        }

        /* High-resolution 4K Display Tweaks */
        @media (min-width: 2000px) {
            :root {
                --glass-shadow: 0 30px 60px rgba(214, 48, 49, 0.25);
            }
        }
    </style>
</head>
<body>

    <div class="ambient-container" aria-hidden="true">
        <div class="balloon b1">🎈</div>
        <div class="balloon b2">🌸</div>
        <div class="balloon b3">✨</div>
        <div class="balloon b4">💖</div>
        <div class="balloon b5">🎉</div>
        <div class="balloon b6">🌷</div>
        <div class="balloon b7">✨</div>
    </div>

    <div class="card-wrapper">
        <main class="card">
            <!-- Direct Route Link to birthday.html -->
            <div class="gift-wrapper">
                <a href="{% url 'birthday' %}" class="gift-box" title="Click to open your surprise!" aria-label="Open your birthday surprise gift">🎁</a>
            </div>
            
            <h1>Hey Oindrila!</h1>
            <p class="subtitle">A special birthday surprise is waiting for you...</p>
            
            <!-- Action Button Routing to birthday.html -->
            <div class="btn-wrapper">
                <a href="{% url 'birthday' %}" class="open-btn">
                    <span>Open Your Gift ✨</span>
                    <span class="btn-arrow" aria-hidden="true">➔</span>
                </a>
            </div>
        </main>
    </div>

</body>
</html>
