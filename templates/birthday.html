<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Happy Birthday {{ name }}! ✨</title>
    
    <!-- Google Fonts for Cursive & Friendly Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-pink: #ff4757;
            --secondary-pink: #ff6b81;
            --text-dark: #6d214f;
            --title-red: #d63031;
            --glass-bg: rgba(255, 255, 255, 0.42);
            --glass-border: rgba(255, 255, 255, 0.7);
            --glass-shadow: 0 20px 45px rgba(214, 48, 49, 0.22), 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            /* Identical Soft Pink & Rose Gradient Background */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #f3a683 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh; /* Modern mobile dynamic viewport height support */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing Script', cursive;
            position: relative;
            padding: clamp(16px, 4vw, 40px);
        }

        .ambient-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .floating-icon {
            position: absolute;
            bottom: -100px;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            opacity: 0.75;
            animation: floatUp 10s infinite cubic-bezier(0.4, 0, 0.6, 1);
            user-select: none;
            will-change: transform, opacity;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        /* Staggered Floating Elements across viewports */
        .f1 { left: 5%;  animation-duration: 9s;  animation-delay: 0s; }
        .f2 { left: 18%; animation-duration: 12s; animation-delay: 2.5s; font-size: clamp(2rem, 5vw, 3.8rem); }
        .f3 { left: 32%; animation-duration: 10s; animation-delay: 5s; }
        .f4 { left: 48%; animation-duration: 14s; animation-delay: 1s; }
        .f5 { left: 62%; animation-duration: 11s; animation-delay: 3.5s; font-size: clamp(2.2rem, 4.5vw, 3.5rem); }
        .f6 { left: 76%; animation-duration: 9.5s; animation-delay: 0.5s; }
        .f7 { left: 89%; animation-duration: 13s; animation-delay: 4s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            20% {
                opacity: 0.85;
            }
            80% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(calc(-100vh - 120px)) rotate(25deg) scale(1.15);
                opacity: 0;
            }
        }

        .card-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: clamp(320px, 92vw, 560px);
            display: flex;
            justify-content: center;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--glass-border);
            border-radius: clamp(22px, 5vw, 36px);
            padding: clamp(32px, 7vw, 54px) clamp(20px, 6vw, 44px);
            text-align: center;
            width: 100%;
            box-shadow: var(--glass-shadow);
            animation: softAppear 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Glass Shine Effect */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.28) 50%,
                transparent 55%
            );
            animation: shine 7s infinite linear;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translate(-30%, -30%) rotate(0deg); }
            100% { transform: translate(30%, 30%) rotate(0deg); }
        }

        @keyframes softAppear {
            from {
                opacity: 0;
                transform: scale(0.85) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .sparkle-wrapper {
            display: inline-block;
            margin-bottom: clamp(10px, 2.5vw, 18px);
            position: relative;
        }

        .sparkle-icon {
            font-size: clamp(3.5rem, 12vw, 5.5rem);
            display: inline-block;
            cursor: pointer;
            user-select: none;
            animation: pulseGlow 2.5s infinite ease-in-out;
            filter: drop-shadow(0 8px 16px rgba(255, 71, 87, 0.35));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                filter: drop-shadow(0 8px 16px rgba(255, 71, 87, 0.35));
            }
            50% {
                transform: scale(1.12) rotate(6deg);
                filter: drop-shadow(0 14px 24px rgba(255, 71, 87, 0.5));
            }
        }

        @media (hover: hover) {
            .sparkle-icon:hover {
                transform: scale(1.25) rotate(-8deg);
            }
        }

        .sparkle-icon:active {
            transform: scale(0.92);
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--title-red);
            font-size: clamp(2.6rem, 8.5vw, 4.4rem);
            line-height: 1.15;
            margin-bottom: clamp(10px, 2.5vw, 18px);
            text-shadow: 2px 2px 6px rgba(255, 255, 255, 0.7);
            word-wrap: break-word;
        }

        p.wish-message {
            font-family: 'Dancing Script', cursive;
            color: var(--text-dark);
            font-size: clamp(1.3rem, 4.5vw, 2.05rem);
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: clamp(26px, 6vw, 40px);
            word-wrap: break-word;
        }

        .btn-wrapper {
            display: inline-block;
            width: 100%;
        }

        .next-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: clamp(240px, 85%, 340px);
            background: linear-gradient(135deg, var(--primary-pink), var(--secondary-pink));
            color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            font-size: clamp(1.05rem, 3.2vw, 1.3rem);
            font-weight: 700;
            padding: clamp(14px, 3.5vw, 18px) clamp(24px, 5vw, 38px);
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.45);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            outline: none;
            border: none;
        }

        .next-btn:focus-visible {
            outline: 3px solid var(--text-dark);
            outline-offset: 4px;
        }

        @media (hover: hover) {
            .next-btn:hover {
                background: linear-gradient(135deg, #ff6b81, #ff4757);
                transform: translateY(-4px) scale(1.03);
                box-shadow: 0 16px 32px rgba(255, 71, 87, 0.6);
            }
        }

        .next-btn:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 6px 18px rgba(255, 71, 87, 0.4);
        }

        .btn-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        @media (hover: hover) {
            .next-btn:hover .btn-arrow {
                transform: translateX(5deg);
            }
        }

        @media (max-height: 520px) and (orientation: landscape) {
            body {
                padding: 12px;
            }
            .card {
                padding: 20px 28px;
                display: grid;
                grid-template-columns: auto 1fr;
                align-items: center;
                column-gap: 24px;
                text-align: left;
                max-width: 620px;
            }
            .sparkle-wrapper {
                grid-row: span 3;
                margin-bottom: 0;
            }
            h1 {
                font-size: 2.4rem;
                margin-bottom: 4px;
            }
            p.wish-message {
                font-size: 1.25rem;
                margin-bottom: 14px;
            }
            .next-btn {
                max-width: 100%;
                padding: 10px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-container" aria-hidden="true">
        <div class="floating-icon f1">🎉</div>
        <div class="floating-icon f2">🌸</div>
        <div class="floating-icon f3">✨</div>
        <div class="floating-icon f4">💖</div>
        <div class="floating-icon f5">👑</div>
        <div class="floating-icon f6">🎈</div>
        <div class="floating-icon f7">🌷</div>
    </div>

    <!-- Main Celebration Card -->
    <div class="card-wrapper">
        <main class="card">
            <div class="sparkle-wrapper">
                <div class="sparkle-icon" id="interactiveCrown" role="button" tabindex="0" title="Click for extra fireworks!" aria-label="Interactive crown icon">👑</div>
            </div>
            
            <!-- Dynamic Name & Message from Django Context -->
            <h1>Happy Birthday, {{ name }}!</h1>
            <p class="wish-message">{{ message }}</p>

            <!-- Direct Route to Cake Cut Page -->
            <div class="btn-wrapper">
                <a href="{% url 'cakecut' %}" class="next-btn" id="cakeBtn">
                    <span>Let's Cut the Cake! 🎂</span>
                    <span class="btn-arrow" aria-hidden="true">➔</span>
                </a>
            </div>
        </main>
    </div>

    <script>
        window.addEventListener('load', () => {
            // Initial Celebration Fireworks & Confetti Burst
            const duration = 2.5 * 1000;
            const animationEnd = Date.now() + duration;

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            // Confetti Cannon sequence
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4757', '#ff6b81', '#fecfef', '#ffffff', '#ffd700']
            });

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                const particleCount = 20 * (timeLeft / duration);
                
                confetti({
                    particleCount,
                    startVelocity: 25,
                    spread: 360,
                    ticks: 60,
                    origin: { x: randomInRange(0.1, 0.4), y: Math.random() - 0.2 },
                    colors: ['#ff4757', '#ff6b81', '#ffffff', '#ffd700']
                });
                confetti({
                    particleCount,
                    startVelocity: 25,
                    spread: 360,
                    ticks: 60,
                    origin: { x: randomInRange(0.6, 0.9), y: Math.random() - 0.2 },
                    colors: ['#ff4757', '#ff6b81', '#ffffff', '#ffd700']
                });
            }, 350);

            // Interactive click burst on Crown
            const crown = document.getElementById('interactiveCrown');
            const triggerBurst = (e) => {
                const rect = crown.getBoundingClientRect();
                const x = (rect.left + rect.width / 2) / window.innerWidth;
                const y = (rect.top + rect.height / 2) / window.innerHeight;

                confetti({
                    particleCount: 45,
                    spread: 60,
                    origin: { x, y },
                    colors: ['#ffd700', '#ff4757', '#ffffff']
                });
            };

            crown.addEventListener('click', triggerBurst);
            crown.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    triggerBurst(e);
                }
            });
        });
    </script>
</body>
</html>
